document.addEventListener(
    "keydown",

    function (event) {

        const key =
            event.key.toLowerCase();

        keys[key] = true;


        if (
            key.startsWith("arrow") ||
            [
                "w",
                "a",
                "s",
                "d",
                "e",
                "1",
                "2",
                "3",
                "4"
            ].includes(key)
        ) {

            event.preventDefault();
        }


        // INTERACT

        if (
            key === "e" &&
            !event.repeat &&
            gameState === "bedroom"
        ) {

            interact();
        }


        // QUIZ ANSWERS

        if (
            gameState === "quiz" &&
            !event.repeat

);

    function (event) {

            event.key.toLowerCase();

    "blur",

    function () {

);


// ============================================================
// COLLISION
// ============================================================

function isColliding(a, b) {

    return (

        a.x < b.x + b.width &&

        a.x + a.width > b.x &&

        a.y < b.y + b.height &&

        a.y + a.height > b.y

    );
}


// ============================================================
// MOVEMENT
// ============================================================

function movePlayer() {

    if (
        gameState !== "bedroom"
    ) {

        return;
    }


    let dx = 0;
    let dy = 0;


    if (
        keys["w"] ||
        keys["arrowup"]
    ) {

        dy -= 1;
    }


    if (
        keys["s"] ||
        keys["arrowdown"]
    ) {

        dy += 1;
    }


    if (
        keys["a"] ||
        keys["arrowleft"]
    ) {

        dx -= 1;
    }


    if (
        keys["d"] ||
        keys["arrowright"]
    ) {

        dx += 1;
    }


    // Normalise diagonal movement

    if (
        dx !== 0 &&
        dy !== 0
    ) {

        dx *= Math.SQRT1_2;
        dy *= Math.SQRT1_2;
    }


    // HORIZONTAL MOVEMENT

    const oldX =
        player.x;


    player.x +=
        dx * player.speed;


    player.x =
        Math.max(
            0,
            Math.min(
                player.x,
                canvas.width -
                player.width
            )
        );


    for (
        const item of furniture
    ) {

        if (
            isColliding(
                player,
                item
            )
        ) {

            player.x =
                oldX;

            break;
        }
    }


    // VERTICAL MOVEMENT

    const oldY =
        player.y;


    player.y +=
        dy * player.speed;


    player.y =
        Math.max(
            0,
            Math.min(
                player.y,
                canvas.height -
                player.height
            )
        );


    for (
        const item of furniture
    ) {

        if (
            isColliding(
                player,
                item
            )
        ) {

            player.y =
                oldY;

            break;
        }
    }
}


// ============================================================
// INTERACTION DISTANCE
// ============================================================

function isNearObject(
    playerObject,
    furnitureObject,
    distance = 12
) {

    const area = {

        x:
            furnitureObject.x -
            distance,

        y:
            furnitureObject.y -
            distance,

        width:
            furnitureObject.width +
            distance * 2,

        height:
            furnitureObject.height +
            distance * 2
    };


    return isColliding(
        playerObject,
        area
    );
}


// ============================================================
// GET NEAREST OBJECT
// ============================================================

function getNearbyObject() {

    let nearestObject =
        null;

    let nearestDistance =
        Infinity;


    for (
        const item of furniture
    ) {

        if (
            !item.interactive ||
            !isNearObject(
                player,
                item
            )
        ) {

            continue;
        }


        const playerCenterX =
            player.x +
            player.width / 2;


        const playerCenterY =
            player.y +
            player.height / 2;


        const objectCenterX =
            item.x +
            item.width / 2;


        const objectCenterY =
            item.y +
            item.height / 2;


        const distance =
            Math.hypot(

                playerCenterX -
                objectCenterX,

                playerCenterY -
                objectCenterY
            );


        if (
            distance <
            nearestDistance
        ) {

            nearestDistance =
                distance;

            nearestObject =
                item;
        }
    }


    return nearestObject;
}


// ============================================================
// INTERACT
// ============================================================

function interact() {

    const object =
        getNearbyObject();


    if (!object) {

        return;
    }


    if (
        object.name === "bed"
    ) {

        sleep();
    }


    else if (
        object.name === "desk"
    ) {

        startQuiz();
    }


    else if (
        object.name === "tv"
    ) {

        startTVGame();
    }
}

// ============================================================
// TIME
// ============================================================

function formatTime(time) {

    const totalMinutes =
        Math.round(
            time * 60
        );


    let hour =
        Math.floor(
            totalMinutes / 60
        );


    const minutes =
        totalMinutes % 60;


    const period =
        hour >= 12
            ? "PM"
            : "AM";


    let displayHour =
        hour % 12;


    if (
        displayHour === 0
    ) {

        displayHour = 12;
    }


    const displayMinutes =
        String(
            minutes
        ).padStart(
            2,
            "0"
        );


    return (

        displayHour +
        ":" +
        displayMinutes +
        " " +
        period
    );
}

// ============================================================
// SHUFFLE ARRAY
// ============================================================

function shuffleArray(array) {

    const shuffled =
        [...array];


    for (
        let i =
            shuffled.length - 1;

        i > 0;

        i--
    ) {

        const randomIndex =
            Math.floor(
                Math.random() *
                (i + 1)
            );


        const temp =
            shuffled[i];


        shuffled[i] =
            shuffled[randomIndex];


        shuffled[randomIndex] =
            temp;
    }


    return shuffled;
}


// ============================================================
// QUIZ
// ============================================================

let quizQuestions = [];

let currentQuestion = 0;

let correctAnswers = 0;

let wrongAnswers = 0;

let quizButtons = [];


// ============================================================
// ASSIGNMENT BUTTONS
// ============================================================

let tryAgainButton = null;

let assignmentBackButton = null;


// ============================================================
// START QUIZ
// ============================================================

function startQuiz() {

    if (
        currentTime >=
        deadlineTime
    ) {

        if (
            !assignmentComplete
        ) {

            checkDeadline();
        }

        else {

            showStatus(
                "The deadline has passed."
            );

            gameState =
                "bedroom";
        }


        return;
    }


    const selectedQuestions =
        shuffleArray(
            questionBank
        ).slice(
            0,
            5
        );


    quizQuestions =
        selectedQuestions.map(

            function (question) {

                return {

                    question:
                        question.question,

                    correct:
                        question.correct,

                    answers:
                        shuffleArray(
                            question.answers
                        )
                };
            }
        );


    currentQuestion = 0;

    correctAnswers = 0;

    wrongAnswers = 0;


    gameState =
        "quiz";
}


// ============================================================
// ANSWER QUIZ
// ============================================================

function answerQuiz(answerIndex) {

    if (
        gameState !== "quiz"
    ) {

        return;
    }


    const question =
        quizQuestions[
            currentQuestion
        ];


    const selectedAnswer =
        question.answers[
            answerIndex
        ];


    if (
        selectedAnswer ===
        question.correct
    ) {

        correctAnswers++;
    }

    else {

        wrongAnswers++;
    }


    // TWO WRONG = FAILED ATTEMPT

    if (
        wrongAnswers >= 2
    ) {

        assignmentAttempts++;


        gradeStatus =
            "F";


        assignmentComplete =
            false;


        assignmentResultMessage =
            "Too many incorrect answers.";


        gameState =
            "assignmentResult";


        return;
    }


    currentQuestion++;


    // FINISHED ALL FIVE

    if (
        currentQuestion >=
        quizQuestions.length
    ) {

        assignmentAttempts++;


        assignmentComplete =
            true;


        if (
            correctAnswers === 5
        ) {

            gradeStatus =
                "A";
        }

        else {

            gradeStatus =
                "B";
        }


        assignmentResultMessage =
            "Assignment completed!";


        gameState =
            "assignmentResult";
    }
}


// ============================================================

// ============================================================

let tvHighScore = 0;

const tvRoundLength =
    15000;

let tvStartTime = 0;


const tvTarget = {

    x: 100,
    y: 100,

    size: 18
};


let tvPlayAgainButton = null;

let tvBackButton = null;


// ============================================================
// START TV
// ============================================================

function startTVGame() {

    if (
        checkDeadline()
    ) {

        return;
    }


    tvScore = 0;


    tvStartTime =
        performance.now();


    spawnTVTarget();


    gameState =
        "tv";
}


// ============================================================

// ============================================================

    tvTarget.x =
        20 +
        Math.random() *
        (
            canvas.width -
            40 -
            tvTarget.size
        );


    tvTarget.y =
        55 +
        Math.random() *
        (
            canvas.height -
            75 -
            tvTarget.size
        );
}


// ============================================================
// UPDATE TV
// ============================================================

function updateTV() {

    if (
        gameState !== "tv"
    ) {

        return;
    }


    const elapsed =
        performance.now() -
        tvStartTime;


    if (
        elapsed >=
        tvRoundLength
    ) {

        finishTVRound();
    }
}


// ============================================================
// FINISH TV ROUND
// ============================================================

function finishTVRound() {

    if (
        tvScore >
        tvHighScore
    ) {

        tvHighScore =
            tvScore;
    }


    // ONE HOUR PASSES

    currentTime += 1;


    if (
        checkDeadline()
    ) {

        return;
    }


    gameState =
        "tvResult";
}


// ============================================================
// MOUSE POSITION
// ============================================================

function getMousePosition(event) {

    const rect =
        canvas.getBoundingClientRect();


    return {

        x:
            (
                event.clientX -
                rect.left
            ) *
            canvas.width /
            rect.width,

        y:
            (
                event.clientY -
                rect.top
            ) *
            canvas.height /
            rect.height
    };
}


// ============================================================
// CLICK RECTANGLE
// ============================================================

function pointInRect(
    point,
    rectangle
) {

    return (

        point.x >=
        rectangle.x &&

        point.x <=
        rectangle.x +
        rectangle.width &&

        point.y >=
        rectangle.y &&

        point.y <=
        rectangle.y +
        rectangle.height
    );
}


// ============================================================
// CANVAS CLICK
// ============================================================

canvas.addEventListener(
    "click",

    function (event) {

        const mouse =
            getMousePosition(
                event
            );


        // QUIZ

        if (
            gameState === "quiz"
        ) {

            for (
                let i = 0;

                i <
                quizButtons.length;

                i++
            ) {

                if (
                    pointInRect(
                        mouse,
                        quizButtons[i]
                    )
                ) {

                    answerQuiz(i);

                    return;
                }
            }
        }


        // ASSIGNMENT RESULT

        else if (
            gameState ===
            "assignmentResult"
        ) {

            if (
                tryAgainButton &&
                pointInRect(
                    mouse,
                    tryAgainButton
                )
            ) {

                startQuiz();

                return;
            }


            if (
                assignmentBackButton &&
                pointInRect(
                    mouse,
                    assignmentBackButton
                )
            ) {

                gameState =
                    "bedroom";

                return;
            }
        }


        // TV TARGET

        else if (
            gameState === "tv"
        ) {

            const targetRectangle = {

                x:
                    tvTarget.x,

                y:
                    tvTarget.y,

                width:
                    tvTarget.size,

                height:
                    tvTarget.size
            };


            if (
                pointInRect(
                    mouse,
                    targetRectangle
                )
            ) {

                tvScore++;

                spawnTVTarget();
            }
        }


        // TV RESULTS

        else if (
            gameState ===
            "tvResult"
        ) {

            if (
                tvPlayAgainButton &&
                pointInRect(
                    mouse,
                    tvPlayAgainButton
                )
            ) {

                startTVGame();

                return;
            }


            if (
                tvBackButton &&
                pointInRect(
                    mouse,
                    tvBackButton
                )
            ) {

                gameState =
                    "bedroom";

                return;
            }
        }

    }
);


// ============================================================
// GENERIC BUTTON
// ============================================================

function drawButton(
    rectangle,
    text
) {

    ctx.fillStyle =
        "#454545";


    ctx.fillRect(

        rectangle.x,
        rectangle.y,

        rectangle.width,
        rectangle.height
    );


    ctx.strokeStyle =
        "#bbbbbb";


    ctx.strokeRect(

        rectangle.x,
        rectangle.y,

        rectangle.width,
        rectangle.height
    );


    ctx.fillStyle =
        "#ffffff";


    ctx.textAlign =
        "center";


    ctx.font =
        "8px monospace";


    ctx.fillText(

        text,

        rectangle.x +
        rectangle.width / 2,

        rectangle.y +
        rectangle.height / 2 +
        3
    );
}

// DRAW BEDROOM
// ============================================================

function drawBedroom() {

    if (
        roomImage.loaded
    ) {

        ctx.drawImage(

            roomImage,

            0,
            0,

            canvas.width,
            canvas.height
        );
    }

    else {

        drawPlaceholderRoom();
    }


    // ALL FURNITURE IS INSIDE CANVAS

    drawFurniture();

    drawPlayer();

    drawHUD();

    drawInteractionPrompt();

    drawStatusMessage();
}


// ============================================================
// PLACEHOLDER ROOM
// ============================================================

function drawPlaceholderRoom() {

    // FLOOR

    ctx.fillStyle =
        "#b99972";


    ctx.fillRect(

        0,
        0,

        canvas.width,
        canvas.height
    );


    // WALL

    ctx.fillStyle =
        "#ddc8a4";


    ctx.fillRect(

        0,
        0,

        canvas.width,
        25
    );


    // BORDER

    ctx.fillStyle =
        "#67513d";


    ctx.fillRect(

        0,
        23,

        canvas.width,
        3
    );


    // FLOOR LINES

    ctx.strokeStyle =
        "rgba(80,60,40,0.25)";


    for (
        let y = 45;

        y <
        canvas.height;

        y += 22
    ) {

        ctx.beginPath();

        ctx.moveTo(
            0,
            y
        );

        ctx.lineTo(
            canvas.width,
            y
        );

        ctx.stroke();
    }
}

function drawFurniture() {

    for (
        const item of furniture
    ) {

        // USE PNG IMAGE

        if (
            item.image.loaded
        ) {

            ctx.drawImage(

                item.image,

                Math.round(
                    item.x
                ),

                Math.round(
                    item.y
                ),

                item.width,
                item.height
            );
        }


        // PLACEHOLDER

        else {

            ctx.fillStyle =
                item.color;


            ctx.fillRect(

                item.x,
                item.y,

                item.width,
                item.height
            );


            ctx.strokeStyle =
                "#191919";


            ctx.strokeRect(

                item.x,
                item.y,

                item.width,
                item.height
            );


            ctx.fillStyle =
                "#ffffff";


            ctx.font =
                "7px monospace";


            ctx.textAlign =
                "center";


            ctx.fillText(

                item.name.toUpperCase(),

                item.x +
                item.width / 2,

                item.y +
                item.height / 2 +
                2
            );
        }
    }
}

// ============================================================
// WRAP TEXT
// ============================================================

function drawCenteredWrappedText(
    text,
    x,
    y,
    maxWidth,
    lineHeight
) {

    const words =
        text.split(" ");


    let line = "";

    let currentY = y;


    ctx.textAlign =
        "center";


    for (
        let i = 0;

        i <
        words.length;

        i++
    ) {

        const testLine =
            line +
            words[i] +
            " ";


        const width =
            ctx.measureText(
                testLine
            ).width;


        if (
            width >
            maxWidth &&
            i > 0
        ) {

            ctx.fillText(

                line.trim(),

                x,
                currentY
            );


            line =
                words[i] +
                " ";


            currentY +=
                lineHeight;
        }

        else {

            line =
                testLine;
        }
    }


    ctx.fillText(

        line.trim(),

        x,
        currentY
    );
}


// ============================================================
// DRAW GAME
// ============================================================

function drawGame() {

    ctx.clearRect(

        0,
        0,

        canvas.width,
        canvas.height
    );


    if (
        gameState === "bedroom"
    ) {

        drawBedroom();
    }


    else if (
        gameState === "quiz"
    ) {

        drawQuiz();
    }


    else if (
        gameState ===
        "assignmentResult"
    ) {

        drawAssignmentResult();
    }


    else if (
        gameState === "tv"
    ) {

        drawTVGame();
    }


    else if (
        gameState === "tvResult"
    ) {

        drawTVResult();
    }


    else if (
        gameState ===
        "deadlineMissed"
    ) {

        drawDeadlineMissed();
    }
}


// ============================================================
// GAME LOOP
// ============================================================

function gameLoop() {

    movePlayer();

    updateTV();

    drawGame();


    requestAnimationFrame(
        gameLoop
    );
}


// ============================================================
// START
// ============================================================

gameLoop();
